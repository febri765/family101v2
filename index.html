let score=0;
let opened=[];
let wrongCount=0;
let currentQuestion;

let order=[
...questions.keys()
].sort(()=>Math.random()-0.5);

let pos=0;

let timer;
let seconds=120;

function showPopup(text,icon,callback){

const popup=document.getElementById("popup");

popup.innerHTML=`
<div>${text}</div>
<div class="big">${icon}</div>
`;

popup.style.display="flex";

setTimeout(()=>{

popup.style.display="none";

if(callback) callback();

},3000);

}

function updateMistakes(){

let html="";

for(let i=0;i<5;i++){

if(i<wrongCount){
html+="❌";
}else{
html+="⬜";
}

}

document.getElementById("mistakes").innerHTML=html;

}

function formatTime(sec){

let m=Math.floor(sec/60);
let s=sec%60;

return String(m).padStart(2,"0")
+":"+String(s).padStart(2,"0");

}

function startTimer(){

clearInterval(timer);

seconds=120;

document.getElementById("timer").innerText=
"⏱️ "+formatTime(seconds);

timer=setInterval(()=>{

seconds--;

document.getElementById("timer").innerText=
"⏱️ "+formatTime(seconds);

if(seconds<=0){

clearInterval(timer);

revealAll("⏰ WAKTU HABIS");

}

},1000);

}

function renderAnswers(){

let html="";

for(let i=0;i<5;i++){

html+=`
<div class="answer">
${i+1}. ${
opened.includes(i)
? currentQuestion.a[i]
: "?"
}
</div>
`;

}

document.getElementById("answers").innerHTML=html;

}

function revealAll(title){

showPopup("SURVEI MEMBUKTIKAN...","⏳",()=>{

opened=[0,1,2,3,4];

renderAnswers();

document.getElementById("nextBtn")
.style.display="inline-block";

});

}

function loadQuestion(){

opened=[];

wrongCount=0;

updateMistakes();

document.getElementById("input").value="";

currentQuestion=
questions[order[pos]];

document.getElementById("question")
.innerText=currentQuestion.q;

document.getElementById("nextBtn")
.style.display="none";

renderAnswers();

startTimer();

}
  
function checkAnswer(){

let input=document
.getElementById("input")
.value
.trim()
.toLowerCase();

document.getElementById("input").value="";

if(!input) return;

let found=-1;

for(let i=0;i<5;i++){

if(
currentQuestion.a[i]
.toLowerCase()===input
){
found=i;
break;
}

}

showPopup("SURVEI MEMBUKTIKAN...","⏳",()=>{

if(found!==-1){

if(opened.includes(found)){

showPopup(
"JAWABAN SUDAH DIBUKA",
"⚠️"
);

return;

}

opened.push(found);

score+=10;

document.getElementById("score")
.innerText=score;

renderAnswers();

showPopup("BENAR","✅");

if(opened.length===5){

clearInterval(timer);

score+=50;

document.getElementById("score")
.innerText=score;

showPopup(
"SEMUA JAWABAN TERBUKA! +50",
"🎉"
);

document.getElementById("nextBtn")
.style.display="inline-block";

}

}else{

wrongCount++;

updateMistakes();

showPopup("SALAH","❌");

if(wrongCount>=5){

clearInterval(timer);

revealAll("5 KALI SALAH");

}

}

});

}

function nextQuestion(){

pos++;

if(pos>=order.length){

order=[
...questions.keys()
].sort(()=>Math.random()-0.5);

pos=0;

}

loadQuestion();

}

loadQuestion();

</script>
